<!doctype html>
<html lang="fr-FR">
  <head>
    <meta charset="utf-8" />
    <title>Tous les sondages</title>
     {% load static %}
    <link rel="stylesheet" href="{% static 'polls/style.css' %}">
  </head>
  <body>
    <h1>Tous les sondages</h1>
    {% if question_list %}
      <ul>
        {% for question in question_list %}
          <li>
            #{{ question.id }} —
            <a href="{% url 'polls:frequency' question.id %}">{{ question.question_text }}</a>
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p>Aucun sondage n'est disponible.</p>
    {% endif %}
  </body>
</html>
